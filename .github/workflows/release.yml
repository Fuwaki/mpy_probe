name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mpy_probe-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mpy_probe-linux-arm64
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mpy_probe-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mpy_probe-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: ${{ runner.os != 'Windows' }}
        run: cp target/${{ matrix.target }}/release/mpy_probe ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: cp target/${{ matrix.target }}/release/mpy_probe.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mpy_probe-linux-amd64
            artifacts/mpy_probe-linux-amd64.sha256
            artifacts/mpy_probe-linux-arm64
            artifacts/mpy_probe-linux-arm64.sha256
            artifacts/mpy_probe-macos-arm64
            artifacts/mpy_probe-macos-arm64.sha256
            artifacts/mpy_probe-windows-amd64.exe
            artifacts/mpy_probe-windows-amd64.exe.sha256
